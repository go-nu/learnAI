<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonCraft 관리자 로그인</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#00C73C',
                            hover: '#00A832',
                        }
                    }
                }
            }
        }
    </script>

    <!-- SweetAlert2 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-10">

        <!-- 로고 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-primary tracking-tight">ToonCraft</h1>
            <p class="text-sm text-gray-400 mt-1">관리자 페이지</p>
        </div>

        <!-- 로그인 폼 -->
        <form method="POST" action="/login" id="loginForm">
            {% csrf_token %}

            <div class="space-y-4">
                <!-- 아이디 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
                    <input type="text" name="username" id="username"
                           placeholder="아이디를 입력하세요"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm
                                  focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>

                <!-- 비밀번호 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                    <input type="password" name="password" id="password"
                           placeholder="비밀번호를 입력하세요"
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm
                                  focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                </div>
            </div>

            <!-- 로그인 버튼 -->
            <button type="submit"
                    class="w-full mt-6 py-3 bg-primary hover:bg-green-600 text-white font-bold
                           rounded-lg text-sm transition-colors">
                로그인
            </button>
        </form>

    </div>

    <!-- 로그인 실패 시 SweetAlert2 알림 -->
    {% if error %}
    <script>
        Swal.fire({
            icon: 'error',
            title: '로그인 실패',
            text: '{{ error }}',
            confirmButtonText: '확인',
            confirmButtonColor: '#00C73C',
        });
    </script>
    {% endif %}

</body>
</html>
