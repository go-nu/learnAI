<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상품 상세 · 리뷰 에이전트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ui.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header class="topbar">
  <div class="wrapper topbar-inner">
    <a class="brand" href="products.html">
      <span class="brand-mark">리</span>
      <span class="brand-name">리뷰 에이전트</span>
    </a>
    <div class="topbar-right">
      <span class="user">김고객 님</span>
      <span class="divider-v"></span>
      <a class="btn btn-secondary btn-sm" href="login.html">로그아웃</a>
    </div>
  </div>
</header>
<main data-screen-label="P3 상품상세">
  <div class="wrapper">
    <div class="crumb"><a href="products.html">← 상품 목록</a></div>
    <div class="detail-cols">
      <div class="detail-left">
        <div class="imgph product-media"><span class="cam">상품 이미지</span></div>
        <div class="product-name">무선 블루투스 이어폰</div>
        <div class="product-cat">디지털 / 음향</div>
        <p class="product-desc">노이즈 캔슬링과 30시간 재생을 지원하는 무선 이어폰입니다. 가벼운 착용감과 안정적인 블루투스 5.3 연결성을 제공하며, IPX4 생활방수를 지원합니다.</p>
      </div>
      <div class="detail-right">
        <h2 class="h-sec">리뷰 작성</h2>
        <div class="card review-form">
          <div class="form-row">
            <span class="label">별점</span>
            <span class="stars ratepick" id="ratepick">
              <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span class="off" data-v="4">★</span><span class="off" data-v="5">★</span>
            </span>
          </div>
          <textarea class="field" rows="5" placeholder="리뷰를 작성해 주세요..."></textarea>
          <button class="btn btn-primary btn-block btn-lg" onclick="submitReview()">리뷰 등록</button>
        </div>
        <div class="review-list-head">
          <h2 class="h-sec">리뷰 목록</h2>
          <div class="muted" id="rvCount"></div>
        </div>
        <hr class="divider" />
        <div id="rvList"></div>
        <div class="pager" id="rvPager"></div>
      </div>
    </div>
  </div>
</main>
<script src="ui-data.js"></script>
<script src="ui-common.js"></script>
<script>
buildNav('detail.html');
/* 별점 */
(function(){
  const pick = document.getElementById('ratepick');
  pick.querySelectorAll('span').forEach(st=>{
    st.addEventListener('click', ()=>{
      const v=+st.dataset.v;
      pick.querySelectorAll('span').forEach(s=>s.classList.toggle('off',(+s.dataset.v)>v));
    });
  });
})();
/* 리뷰 5개/페이지 */
const RV_PER=5; let rvPage=1;
function rvCard(r){
  return `<div class="rv">
    <div class="rv-head">
      <span class="rv-author">${r.author}</span>
      ${starHtml(r.rating)} ${badgeFor(r.sentiment)}
      <span class="rv-date">${r.date}</span>
    </div>
    <p class="rv-text">${r.text}</p>
    ${r.reply?`<div class="reply"><div class="reply-who">관리자 답변</div><div class="reply-text">${r.reply}</div></div>`:''}
  </div>`;
}
function renderRv(){
  const total=Math.ceil(REVIEWS.length/RV_PER);
  if(rvPage>total) rvPage=total;
  const items=REVIEWS.slice((rvPage-1)*RV_PER,(rvPage-1)*RV_PER+RV_PER);
  document.getElementById('rvList').innerHTML=items.map(rvCard).join('');
  document.getElementById('rvPager').innerHTML=pagerHtml(total,rvPage,'gotoRv');
  document.getElementById('rvCount').textContent='총 '+REVIEWS.length+'개';
}
function gotoRv(p){ rvPage=p; renderRv(); window.scrollTo(0,document.querySelector('#rvList').offsetTop-80); }
renderRv();
</script>
</body>
</html>
