<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상품 상세 · 리뷰 에이전트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ui.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="stage">
<div class="app">
  <section class="screen active" data-screen-label="P3 상품상세">
    <div class="appbar">
      <a class="brand" href="products.html" style="text-decoration:none; color:inherit;">리뷰 에이전트</a>
      <span class="right"><span>김고객 님</span><a class="btn btn-sm btn-onslate" href="login.html">로그아웃</a></span>
    </div>
    <div class="wrap">
      <div class="crumb" style="margin-bottom:16px;"><a class="clk linklike" href="products.html" style="text-decoration:none;">← 상품 목록</a></div>
      <div style="display:flex; gap:32px; align-items:flex-start;">
        <div style="flex:0 0 40%;">
          <div class="imgph" style="height:260px; border-radius:12px; margin-bottom:16px;"><span class="cam">상품 이미지</span></div>
          <div style="font-size:24px; font-weight:800; color:var(--navy);">무선 블루투스 이어폰</div>
          <div style="font-size:13px; color:var(--ink2); margin:6px 0 14px;">디지털 / 음향</div>
          <p style="font-size:14px; color:#555; line-height:1.8;">노이즈 캔슬링과 30시간 재생을 지원하는 무선 이어폰입니다. 가벼운 착용감과 안정적인 블루투스 5.3 연결성을 제공하며, IPX4 생활방수를 지원합니다.</p>
        </div>
        <div style="flex:1; min-width:0;">
          <div class="h-sec" style="margin-bottom:14px;">리뷰 작성</div>
          <div class="card" style="padding:20px;">
            <div style="display:flex; align-items:center; gap:14px; margin-bottom:14px;">
              <span style="font-size:14px; color:var(--ink2);">별점</span>
              <span class="stars" id="ratepick" style="font-size:28px; cursor:pointer;">
                <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span class="off" data-v="4">★</span><span class="off" data-v="5">★</span>
              </span>
            </div>
            <textarea class="field" rows="5" placeholder="리뷰를 작성해 주세요..."></textarea>
            <button class="btn btn-primary btn-block btn-lg" style="margin-top:14px;" onclick="submitReview()">리뷰 등록</button>
          </div>
          <div style="display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 10px;">
            <div class="h-sec">리뷰 목록</div>
            <div class="muted" style="font-size:13px;" id="rvCount"></div>
          </div>
          <hr class="divider" />
          <div id="rvList"></div>
          <div class="pager" id="rvPager"></div>
        </div>
      </div>
    </div>
  </section>
</div>
</div>
<script src="ui-data.js"></script>
<script src="ui-common.js"></script>
<script>
buildNav('detail.html');
/* 별점 */
(function(){
  const pick = document.getElementById('ratepick');
  pick.querySelectorAll('span').forEach(st=>{
    st.addEventListener('click', ()=>{
      const v=+st.dataset.v;
      pick.querySelectorAll('span').forEach(s=>s.classList.toggle('off',(+s.dataset.v)>v));
    });
  });
})();
/* 리뷰 5개/페이지 */
const RV_PER=5; let rvPage=1;
function rvCard(r){
  return `<div class="rv">
    <div class="top">
      <span style="font-weight:800;">${r.author}</span>
      ${starHtml(r.rating)} ${badgeFor(r.sentiment)}
      <span style="margin-left:auto; font-size:12px; color:var(--ink2);">${r.date}</span>
    </div>
    <p style="font-size:14px; color:#555; margin-top:8px; line-height:1.7;">${r.text}</p>
    ${r.reply?`<div class="reply"><div style="font-size:12px; font-weight:800; color:var(--navy); margin-bottom:3px;">관리자 답변</div><div style="font-size:13px; color:#666; line-height:1.7;">${r.reply}</div></div>`:''}
  </div>`;
}
function renderRv(){
  const total=Math.ceil(REVIEWS.length/RV_PER);
  if(rvPage>total) rvPage=total;
  const items=REVIEWS.slice((rvPage-1)*RV_PER,(rvPage-1)*RV_PER+RV_PER);
  document.getElementById('rvList').innerHTML=items.map(rvCard).join('');
  document.getElementById('rvPager').innerHTML=pagerHtml(total,rvPage,'gotoRv');
  document.getElementById('rvCount').textContent='총 '+REVIEWS.length+'개';
}
function gotoRv(p){ rvPage=p; renderRv(); window.scrollTo(0,document.querySelector('#rvList').offsetTop-80); }
renderRv();
</script>
</body>
</html>
