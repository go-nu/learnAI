<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인사이트 · 리뷰 에이전트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../ui.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header class="topbar">
  <div class="wrapper topbar-inner">
    <div class="brand">
      <span class="brand-mark">리</span>
      <span class="brand-name">리뷰 에이전트</span>
      <nav class="topnav">
        <a class="navlink" href="dashboard.html">대시보드</a>
        <a class="navlink" href="reviews.html">리뷰 목록</a>
        <a class="navlink active" href="insights.html">인사이트</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span class="user">관리자</span>
      <a class="icon-btn" href="login.html" aria-label="로그아웃">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </a>
    </div>
  </div>
</header>
<main data-screen-label="P7 인사이트">
  <div class="wrapper">
    <div class="page-head">
      <h1 class="page-title">인사이트</h1>
      <p class="page-sub">수집된 리뷰에서 추출한 키워드와 감성 분석 결과입니다.</p>
    </div>

    <section class="row-hero">
      <div class="card hero">
        <div class="hero-label">분석된 리뷰</div>
        <div class="hero-figure">1,284<span class="unit">건</span></div>
        <div class="hero-stats">
          <div class="hero-stat"><div class="k">추출 키워드</div><div class="v">312</div></div>
          <div class="hero-stat"><div class="k">분석 기간</div><div class="v">최근 30일</div></div>
        </div>
      </div>
      <aside class="promo">
        <div class="promo-label">최다 언급 키워드</div>
        <div class="promo-figure">#배송</div>
        <p class="promo-body">가장 많이 언급된 키워드입니다. 전체 키워드 분포를 확인해 보세요.</p>
        <button class="promo-cta" type="button" onclick="document.querySelector('.table-card').scrollIntoView({behavior:'smooth'})">전체 키워드 보기</button>
      </aside>
    </section>

    <section class="row-mid">
      <div class="card">
        <div class="card-head">
          <h2 class="card-title">자주 언급된 키워드 TOP 10</h2>
          <button class="icon-arrow" type="button" aria-label="더보기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </div>
        <div id="barChart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 class="card-title">감성별 TOP 5 키워드</h2></div>
        <div class="sent-group">
          <div class="sent-label">긍정</div>
          <div class="tagwrap"><span class="tag pos">음질</span><span class="tag pos">배송</span><span class="tag pos">디자인</span><span class="tag pos">가성비</span><span class="tag pos">착용감</span></div>
        </div>
        <div class="sent-group">
          <div class="sent-label">중립</div>
          <div class="tagwrap"><span class="tag neu">크기</span><span class="tag neu">색상</span><span class="tag neu">무게</span><span class="tag neu">포장</span><span class="tag neu">설명서</span></div>
        </div>
        <div class="sent-group">
          <div class="sent-label">부정</div>
          <div class="tagwrap"><span class="tag neg">연결</span><span class="tag neg">내구성</span><span class="tag neg">향</span><span class="tag neg">소음</span><span class="tag neg">배터리</span></div>
        </div>
      </div>
    </section>

    <section class="card table-card">
      <div class="card-head">
        <h2 class="card-title">전체 키워드</h2>
        <button class="icon-arrow" type="button" aria-label="더보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>
      <table class="tbl">
        <thead><tr><th>순위</th><th>키워드</th><th>총 언급</th><th>긍정</th><th>중립</th><th>부정</th></tr></thead>
        <tbody id="kwBody"></tbody>
      </table>
      <div class="pager" id="kwPager"></div>
    </section>
  </div>
</main>
<script src="ui-data.js"></script>
<script src="ui-common.js"></script>
<script>
buildNav('insights.html');
const max=KEYWORDS[0].total;
document.getElementById('barChart').innerHTML=KEYWORDS.map((k,i)=>{
  const op=(1-i*0.06).toFixed(2);
  return `<div class="barrow"><span class="lbl">${k.kw}</span><span class="track"><span class="fill" style="width:${Math.round(k.total/max*100)}%; opacity:${op};"></span></span><span class="num">${k.total}</span></div>`;
}).join('');
const KW_PER=5; let kwPage=1;
function renderKw(){
  const total=Math.ceil(KEYWORDS.length/KW_PER);
  const items=KEYWORDS.slice((kwPage-1)*KW_PER,(kwPage-1)*KW_PER+KW_PER);
  document.getElementById('kwBody').innerHTML=items.map((k,idx)=>`
    <tr>
      <td class="rank">${(kwPage-1)*KW_PER+idx+1}</td>
      <td class="kw-name">${k.kw}</td>
      <td>${k.total}</td>
      <td><span class="badge b-pos">${k.pos}</span></td>
      <td><span class="badge b-neu">${k.neu}</span></td>
      <td><span class="badge b-neg">${k.neg}</span></td>
    </tr>`).join('');
  document.getElementById('kwPager').innerHTML=pagerHtml(total,kwPage,'gotoKw');
}
function gotoKw(p){ kwPage=p; renderKw(); }
renderKw();
</script>
</body>
</html>
