<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상품 목록 · 리뷰 에이전트</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ui.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header class="topbar">
  <div class="wrapper topbar-inner">
    <a class="brand" href="products.html">
      <span class="brand-mark">리</span>
      <span class="brand-name">리뷰 에이전트</span>
    </a>
    <div class="topbar-right">
      <span class="user">김고객 님</span>
      <span class="divider-v"></span>
      <a class="btn btn-secondary btn-sm" href="login.html">로그아웃</a>
    </div>
  </div>
</header>
<main data-screen-label="P2 상품목록">
  <div class="wrapper">
    <div class="page-head"><h1 class="page-title">상품 목록</h1></div>
    <div id="prodGrid" class="prod-grid"></div>
  </div>
</main>
<script src="ui-data.js"></script>
<script src="ui-common.js"></script>
<script>
buildNav('products.html');
document.getElementById('prodGrid').innerHTML = PRODUCTS.map(p=>`
  <a class="card prodcard" href="detail.html">
    <div class="imgph prod-media">${p.img?`<span class="cam">상품 이미지</span>`:`<span class="init">${p.name.charAt(0)}</span>`}</div>
    <div class="prod-body">
      <div class="prod-name">${p.name}</div>
      <div class="prod-cat">${p.cat}</div>
      <span class="btn btn-primary btn-block">리뷰 작성하기</span>
    </div>
  </a>`).join('');
</script>
</body>
</html>
