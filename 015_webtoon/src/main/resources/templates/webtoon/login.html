<head>

                    "on-primary-fixed": "#002109",
                    "outline-variant": "#bacbb8",
                    "primary": "#006e2e",
                    "secondary-container": "#40d7fe",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "on-error": "#ffffff",

                    "on-surface-variant": "#3c4a3c",

<style>
    body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f8f9fc; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<style>
    body { min-height: max(884px, 100dvh); }
</style>
</head>
<body class="text-on-surface pb-32">
<header th:replace="~{webtoon/inc_head :: head}"></header>
<main class="max-w-[480px] mx-auto px-margin-mobile flex flex-col items-center justify-center min-h-[calc(100dvh-64px)]">

    <!-- Logo & Title -->
    <div class="flex flex-col items-center gap-stack-sm mb-stack-lg">
        <div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-md">
            <span class="material-symbols-outlined text-white text-[36px]" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">menu_book</span>
        </div>
        <h1 class="font-headline-lg text-headline-lg text-primary">WEBTOON</h1>
        <p class="text-on-surface-variant font-body-md text-body-md text-center">좋아하는 웹툰을 저장하고<br/>나만의 컬렉션을 만들어 보세요.</p>
    </div>

    <!-- Login Card -->
    <div class="w-full bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-stack-lg flex flex-col gap-stack-md">

        <h2 class="font-title-md text-title-md text-center text-on-surface">로그인</h2>

        <!-- Google Login Button -->
        <a href="/oauth2/authorization/google"
           class="flex items-center justify-center gap-stack-sm w-full bg-white border border-outline-variant rounded-xl px-6 py-3 font-title-md text-title-md text-on-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-150 shadow-sm">
            <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            Google로 계속하기
        </a>

        <div class="flex items-center gap-stack-sm">
            <div class="flex-1 h-px bg-outline-variant"></div>
            <span class="text-on-surface-variant font-label-sm text-label-sm">또는</span>
            <div class="flex-1 h-px bg-outline-variant"></div>
        </div>

        <p class="text-center text-on-surface-variant font-body-md text-body-md">
            로그인하면 북마크, 댓글 등 다양한<br/>기능을 이용할 수 있습니다.
        </p>
    </div>

    <!-- Back to Home -->
    <a href="/" class="mt-stack-lg flex items-center gap-base text-primary font-label-sm text-label-sm hover:underline">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        홈으로 돌아가기
    </a>

</main>
<div th:replace="~{webtoon/inc_foot :: foot}"></div>
</body>
</html>
