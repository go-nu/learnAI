<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>대시보드 - WEBTOON Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>body { font-family: 'Be Vietnam Pro', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="flex h-screen overflow-hidden">

    <!-- 좌측 메뉴 -->
    <aside th:replace="~{admin/inc_left :: left}"></aside>

    <!-- 메인 영역 -->
    <div class="flex-1 flex flex-col overflow-hidden">

        <!-- 상단 바 -->
        <header th:replace="~{admin/inc_top :: top}" th:with="pageTitle='대시보드'"></header>

        <!-- 콘텐츠 -->
        <main class="flex-1 overflow-y-auto p-6">

            <!-- 통계 카드 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4 border border-slate-100">
                    <div class="w-12 h-12 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-semibold uppercase tracking-wide">총 회원</p>
                        <p class="text-2xl font-bold text-slate-800 mt-0.5" th:text="${totalUsers}">0</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4 border border-slate-100">
                    <div class="w-12 h-12 rounded-xl bg-green-50 flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-semibold uppercase tracking-wide">총 웹툰</p>
                        <p class="text-2xl font-bold text-slate-800 mt-0.5" th:text="${totalWebtoons}">0</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4 border border-slate-100">
                    <div class="w-12 h-12 rounded-xl bg-purple-50 flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-semibold uppercase tracking-wide">총 에피소드</p>
                        <p class="text-2xl font-bold text-slate-800 mt-0.5" th:text="${totalEpisodes}">0</p>
                    </div>
                </div>
            </div>

            <!-- 최근 데이터 (2열) -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

                <!-- 최근 가입 회원 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-100">
                    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
                        <h3 class="font-bold text-slate-700 text-sm">최근 가입 회원</h3>
                        <a href="/admin/member_list" class="text-xs text-green-700 hover:underline font-semibold">전체 보기</a>
                    </div>
                    <div th:if="${#lists.isEmpty(recentUsers)}" class="px-5 py-8 text-center text-slate-400 text-sm">
                        가입된 회원이 없습니다.
                    </div>
                    <ul th:if="${!#lists.isEmpty(recentUsers)}" class="divide-y divide-slate-50">
                        <li th:each="u : ${recentUsers}" class="flex items-center gap-3 px-5 py-3">
                            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center flex-shrink-0 overflow-hidden">
                                <img th:if="${u.profileImageUrl != null}" th:src="${u.profileImageUrl}"
                                     class="w-full h-full object-cover" alt=""/>
                                <svg th:if="${u.profileImageUrl == null}" class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-semibold text-slate-700 truncate" th:text="${u.nickname}"></p>
                                <p class="text-xs text-slate-400 truncate" th:text="${u.email}"></p>
                            </div>
                            <span class="text-xs text-slate-400 flex-shrink-0"
                                  th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'MM.dd') : '-'}"></span>
                        </li>
                    </ul>
                </div>

                <!-- 최근 등록 웹툰 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-100">
                    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
                        <h3 class="font-bold text-slate-700 text-sm">최근 등록 웹툰</h3>
                        <a href="/admin/webtoon_list" class="text-xs text-green-700 hover:underline font-semibold">전체 보기</a>
                    </div>
                    <div th:if="${#lists.isEmpty(recentWebtoons)}" class="px-5 py-8 text-center text-slate-400 text-sm">
                        등록된 웹툰이 없습니다.
                    </div>
                    <ul th:if="${!#lists.isEmpty(recentWebtoons)}" class="divide-y divide-slate-50">
                        <li th:each="w : ${recentWebtoons}" class="flex items-center gap-3 px-5 py-3">
                            <div class="w-10 h-10 rounded-lg bg-slate-100 overflow-hidden flex-shrink-0">
                                <img th:if="${w.thumbUrl != null}" th:src="${w.thumbUrl}"
                                     class="w-full h-full object-cover" alt=""/>
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-semibold text-slate-700 truncate" th:text="${w.title}"></p>
                                <p class="text-xs text-slate-400" th:text="'ID: ' + ${w.sourceId}"></p>
                            </div>
                            <span class="text-xs text-slate-400 flex-shrink-0"
                                  th:text="${w.createdAt != null ? #temporals.format(w.createdAt, 'MM.dd') : '-'}"></span>
                        </li>
                    </ul>
                </div>

            </div>
        </main>
    </div>
</div>
</body>
</html>
