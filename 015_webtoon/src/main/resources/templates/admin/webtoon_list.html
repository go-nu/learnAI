<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>웹툰관리 - WEBTOON Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>body { font-family: 'Be Vietnam Pro', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="flex h-screen overflow-hidden">

    <aside th:replace="~{admin/inc_left :: left}"></aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header th:replace="~{admin/inc_top :: top}" th:with="pageTitle='웹툰관리'"></header>

        <main class="flex-1 overflow-y-auto p-6">

            <!-- 헤더 -->
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">웹툰 목록</h2>
                    <p class="text-sm text-slate-400 mt-0.5">
                        총 <span class="font-semibold text-slate-600" th:text="${#lists.size(webtoons)}">0</span>개
                    </p>
                </div>
            </div>

            <!-- 테이블 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-100">
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide w-12">No</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">웹툰</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">네이버 ID</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">오늘의웹툰</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">바로가기</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">등록일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(webtoons)}">
                                <td colspan="6" class="text-center py-12 text-slate-400">등록된 웹툰이 없습니다.</td>
                            </tr>
                            <tr th:each="w, stat : ${webtoons}"
                                th:class="${stat.odd} ? 'border-b border-slate-50' : 'border-b border-slate-50 bg-slate-50/50'"
                                class="hover:bg-green-50/30 transition-colors">
                                <td class="px-4 py-3 text-slate-400 text-xs" th:text="${stat.count}"></td>
                                <td class="px-4 py-3">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-12 rounded-lg overflow-hidden bg-slate-100 flex-shrink-0">
                                            <img th:if="${w.thumbUrl != null}" th:src="${w.thumbUrl}"
                                                 class="w-full h-full object-cover" loading="lazy" alt=""/>
                                        </div>
                                        <div class="min-w-0">
                                            <p class="font-semibold text-slate-700 truncate max-w-[200px]" th:text="${w.title}"></p>
                                            <p class="text-xs text-slate-400" th:text="'#' + ${w.id}"></p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-4 py-3 text-slate-600 font-mono text-xs" th:text="${w.sourceId}"></td>
                                <td class="px-4 py-3">
                                    <span th:if="${w.today}"
                                          class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700">오늘</span>
                                    <span th:if="${!w.today}"
                                          class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-400">-</span>
                                </td>
                                <td class="px-4 py-3">
                                    <a th:href="@{'/admin/webtoon_view/' + ${w.id}}"
                                       class="inline-flex items-center gap-1 text-xs text-green-700 hover:underline font-semibold">
                                        상세보기
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                        </svg>
                                    </a>
                                </td>
                                <td class="px-4 py-3 text-slate-500 text-xs"
                                    th:text="${w.createdAt != null ? #temporals.format(w.createdAt, 'yyyy.MM.dd') : '-'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>
</body>
</html>
