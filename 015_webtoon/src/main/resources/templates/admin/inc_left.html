<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="left"
       class="w-60 flex-shrink-0 bg-slate-800 flex flex-col h-screen sticky top-0">

    <!-- 로고 -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-700">
        <div class="w-8 h-8 rounded-lg bg-green-700 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
        </div>
        <div>
            <p class="text-white font-bold text-sm leading-tight">WEBTOON</p>
            <p class="text-slate-400 text-xs">Admin Panel</p>
        </div>
    </div>

    <!-- 메뉴 -->
    <nav class="flex-1 px-3 py-4 overflow-y-auto">
        <p class="text-slate-500 text-[10px] font-semibold uppercase tracking-wider px-3 mb-2">메인</p>
        <ul class="space-y-1">
            <li>
                <a href="/admin"
                   th:class="${currentUri == '/admin'} ?
                       'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-700 text-white text-sm font-semibold' :
                       'flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white text-sm transition-colors'">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    대시보드
                </a>
            </li>
        </ul>

        <p class="text-slate-500 text-[10px] font-semibold uppercase tracking-wider px-3 mt-5 mb-2">관리</p>
        <ul class="space-y-1">
            <li>
                <a href="/admin/member_list"
                   th:class="${currentUri == '/admin/member_list'} ?
                       'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-700 text-white text-sm font-semibold' :
                       'flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white text-sm transition-colors'">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                    회원관리
                </a>
            </li>
            <li>
                <a href="/admin/webtoon_list"
                   th:class="${currentUri == '/admin/webtoon_list'} ?
                       'flex items-center gap-3 px-3 py-2.5 rounded-lg bg-green-700 text-white text-sm font-semibold' :
                       'flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white text-sm transition-colors'">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    웹툰관리
                </a>
            </li>
        </ul>
    </nav>

    <!-- 하단 로그아웃 -->
    <div class="px-3 py-4 border-t border-slate-700">
        <form action="/admin/logout" method="post">
            <button type="submit"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white text-sm transition-colors">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                로그아웃
            </button>
        </form>
    </div>

</aside>
</body>
</html>
