<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WEBTOON 관리자 로그인</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>body { font-family: 'Be Vietnam Pro', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center px-4">

<div class="w-full max-w-sm">

    <!-- 로고 -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-green-700 shadow-lg mb-4">
            <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">WEBTOON</h1>
        <p class="text-slate-400 text-sm mt-1">관리자 로그인</p>
    </div>

    <!-- 로그인 카드 -->
    <div class="bg-slate-800 rounded-2xl shadow-xl p-8">

        <!-- 에러 메시지 -->
        <div th:if="${param.error}" class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <!-- 로그아웃 메시지 -->
        <div th:if="${param.logout}" class="mb-4 p-3 rounded-lg bg-green-500/10 border border-green-500/30 text-green-400 text-sm text-center">
            로그아웃 되었습니다.
        </div>

        <form action="/admin/login" method="post">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">아이디</label>
                    <input type="text" name="username" autocomplete="username" required
                           placeholder="관리자 아이디"
                           class="w-full bg-slate-700 border border-slate-600 text-white placeholder-slate-500 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors"/>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">비밀번호</label>
                    <input type="password" name="password" autocomplete="current-password" required
                           placeholder="비밀번호"
                           class="w-full bg-slate-700 border border-slate-600 text-white placeholder-slate-500 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors"/>
                </div>
            </div>

            <button type="submit"
                    class="mt-6 w-full bg-green-700 hover:bg-green-600 text-white font-semibold py-3 rounded-xl transition-colors active:scale-95 duration-150">
                로그인
            </button>
        </form>
    </div>

    <p class="text-center text-slate-500 text-xs mt-6">© WEBTOON Admin Panel</p>
</div>

</body>
</html>
