<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="top"
        class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between flex-shrink-0">

    <!-- 페이지 제목 / 브레드크럼 -->
    <div>
        <h1 class="text-base font-bold text-slate-800"
            th:text="${pageTitle != null ? pageTitle : '관리자 패널'}">관리자 패널</h1>
        <p class="text-xs text-slate-400 mt-0.5"
           th:text="${'현재 경로: ' + (currentUri != null ? currentUri : '')}"></p>
    </div>

    <!-- 우측: 관리자 정보 -->
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-green-700 flex items-center justify-center">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </div>
            <div class="hidden sm:block">
                <p class="text-sm font-semibold text-slate-700" sec:authentication="name">관리자</p>
                <p class="text-xs text-slate-400">Administrator</p>
            </div>
        </div>
        <div class="w-px h-8 bg-slate-200"></div>
        <form action="/admin/logout" method="post">
            <button type="submit"
                    class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-red-500 transition-colors px-2 py-1 rounded-lg hover:bg-red-50">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                로그아웃
            </button>
        </form>
    </div>

</header>
</body>
</html>
