<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>회원관리 - WEBTOON Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>body { font-family: 'Be Vietnam Pro', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="flex h-screen overflow-hidden">

    <aside th:replace="~{admin/inc_left :: left}"></aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header th:replace="~{admin/inc_top :: top}" th:with="pageTitle='회원관리'"></header>

        <main class="flex-1 overflow-y-auto p-6">

            <!-- 헤더 -->
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">회원 목록</h2>
                    <p class="text-sm text-slate-400 mt-0.5">
                        총 <span class="font-semibold text-slate-600" th:text="${#lists.size(members)}">0</span>명
                    </p>
                </div>
            </div>

            <!-- 테이블 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-100">
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide w-12">No</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">회원정보</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">이메일</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">상태</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">이메일인증</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">마지막 로그인</th>
                                <th class="text-left px-4 py-3 font-semibold text-slate-500 text-xs uppercase tracking-wide">가입일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(members)}">
                                <td colspan="7" class="text-center py-12 text-slate-400">가입된 회원이 없습니다.</td>
                            </tr>
                            <tr th:each="m, stat : ${members}"
                                th:class="${stat.odd} ? 'border-b border-slate-50' : 'border-b border-slate-50 bg-slate-50/50'"
                                class="hover:bg-green-50/30 transition-colors">
                                <td class="px-4 py-3 text-slate-400 text-xs" th:text="${stat.count}"></td>
                                <td class="px-4 py-3">
                                    <div class="flex items-center gap-2.5">
                                        <div class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden flex-shrink-0 flex items-center justify-center">
                                            <img th:if="${m.profileImageUrl != null}" th:src="${m.profileImageUrl}"
                                                 class="w-full h-full object-cover" alt=""/>
                                            <svg th:if="${m.profileImageUrl == null}" class="w-4 h-4 text-slate-400"
                                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                            </svg>
                                        </div>
                                        <div>
                                            <p class="font-semibold text-slate-700" th:text="${m.nickname}"></p>
                                            <p class="text-xs text-slate-400" th:text="'#' + ${m.id}"></p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-4 py-3 text-slate-600" th:text="${m.email}"></td>
                                <td class="px-4 py-3">
                                    <span th:if="${m.status != null and m.status.name() == 'active'}"
                                          class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700">활성</span>
                                    <span th:if="${m.status != null and m.status.name() == 'dormant'}"
                                          class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700">휴면</span>
                                    <span th:if="${m.status != null and m.status.name() == 'suspended'}"
                                          class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700">정지</span>
                                    <span th:if="${m.status != null and m.status.name() == 'withdrawn'}"
                                          class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">탈퇴</span>
                                    <span th:if="${m.status == null}"
                                          class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">-</span>
                                </td>
                                <td class="px-4 py-3">
                                    <span th:if="${m.emailVerifiedAt != null}"
                                          class="inline-flex items-center gap-1 text-xs text-green-600 font-semibold">
                                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                        </svg>
                                        인증완료
                                    </span>
                                    <span th:if="${m.emailVerifiedAt == null}" class="text-xs text-slate-400">미인증</span>
                                </td>
                                <td class="px-4 py-3 text-slate-500 text-xs"
                                    th:text="${m.lastLoginAt != null ? #temporals.format(m.lastLoginAt, 'yyyy.MM.dd HH:mm') : '-'}"></td>
                                <td class="px-4 py-3 text-slate-500 text-xs"
                                    th:text="${m.createdAt != null ? #temporals.format(m.createdAt, 'yyyy.MM.dd') : '-'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>
</body>
</html>
