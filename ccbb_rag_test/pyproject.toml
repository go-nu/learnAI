[project]
name = "fault-ratio-baseline"
version = "0.1.0"
description = "교통사고 과실비율 RAG 챗봇 (baseline + streamlit)"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.6.0",
    "google-generativeai>=0.8.0",
    "pymupdf4llm>=0.0.17",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.58.0",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.2.5",
    "langchain-huggingface>=1.2.2",
    "pdfplumber>=0.11.10",
    "pymupdf>=1.27.2.3",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
